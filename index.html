<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大学模拟器 · 三条路</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --line: rgba(255,255,255,.12);
    --text: #f0f0f6;
    --muted: #b9b9c8;
    --accent: #ffd166;
    --up: #6fe3c9;
    --down: #ff8f7e;
  }
  body {
    min-height: 100vh;
    background: #0b0d14;
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    line-height: 1.78;
    -webkit-font-smoothing: antialiased;
  }
  /* 全屏场景背景 */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #0b0d14; }
  .bg img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity .8s ease;
    filter: brightness(0.65) saturate(1.1);
  }
  .bg img.on { opacity: 1; }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8,10,18,.62), rgba(8,10,18,.42) 40%, rgba(8,10,18,.78));
  }
  #app { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 24px 18px 60px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .logo { font-size: 21px; font-weight: 700; letter-spacing: .1em; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .logo span { color: var(--accent); }
  .toolbar { margin-left: auto; display: flex; gap: 8px; }
  .tbtn {
    cursor: pointer; font-family: inherit; font-size: 12.5px; color: var(--muted);
    background: rgba(10,12,20,.55); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 14px; transition: all .18s; backdrop-filter: blur(6px);
  }
  .tbtn:hover:not(:disabled) { color: #fff; border-color: rgba(255,209,102,.55); }
  .tbtn:disabled { opacity: .35; cursor: default; }

  .steps { display: flex; gap: 8px; align-items: center; margin: 10px 0 16px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.22); transition: all .3s; }
  .dot.done { background: var(--accent); }
  .dot.now { background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.15); }
  .steps-label { color: var(--muted); font-size: 12px; margin-left: 6px; letter-spacing: .1em; text-shadow: 0 1px 6px rgba(0,0,0,.7); }

  .card {
    border: 1px solid var(--line); border-radius: 20px;
    background: rgba(12,14,24,.78); backdrop-filter: blur(14px);
    padding: 30px 28px; box-shadow: 0 24px 70px rgba(0,0,0,.5);
    animation: rise .45s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .chapter { color: var(--accent); font-size: 12px; letter-spacing: .24em; margin-bottom: 8px; }
  h1 { font-size: 27px; line-height: 1.4; margin-bottom: 6px; font-weight: 700; }
  .intro-sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .story p { font-size: 15.5px; margin-bottom: 12px; color: #e6e6f0; }
  .quote { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; color: #d8d8e6; font-size: 15px; margin: 16px 0 0; font-style: italic; }

  .choices { display: grid; gap: 12px; margin-top: 24px; }
  .choice {
    text-align: left; cursor: pointer; color: var(--text);
    border: 1px solid var(--line); border-radius: 14px;
    background: rgba(255,255,255,.045); padding: 15px 18px 15px 20px;
    font-family: inherit; font-size: 15px; display: grid; gap: 5px;
    position: relative; overflow: hidden; transition: transform .18s, border-color .18s, background .18s;
  }
  .choice::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .4; transition: opacity .18s; }
  .choice:hover { transform: translateY(-2px); border-color: rgba(255,209,102,.55); background: rgba(255,209,102,.08); }
  .choice:hover::before { opacity: 1; }
  .choice .tag { font-size: 11.5px; color: var(--accent); letter-spacing: .14em; }
  .choice .title { font-weight: 700; font-size: 16px; }
  .choice .desc { color: var(--muted); font-size: 13.5px; }
  .lean { font-size: 11.5px; color: #9fb4d8; letter-spacing: .1em; }

  .result-box { margin-top: 20px; padding: 18px 20px; border-radius: 14px; background: rgba(255,209,102,.08); border: 1px solid rgba(255,209,102,.25); font-size: 15px; color: #efeff8; }
  .fb { margin-top: 14px; }
  .fb div { font-size: 13.5px; color: #a9c3b8; margin-top: 6px; }
  .fb div::before { content: "— "; color: #6fe3c9; }
  .btn {
    margin-top: 22px; cursor: pointer; font-family: inherit; border: none; border-radius: 12px;
    padding: 13px 26px; font-size: 15px; font-weight: 700; color: #221a06;
    background: linear-gradient(135deg, #ffe29a, var(--accent)); transition: transform .16s, box-shadow .16s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255,209,102,.26); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); margin-left: 10px; font-weight: 500; }
  .btn.ghost:hover { color: var(--text); box-shadow: none; }

  .ending-title { font-size: 31px; margin: 4px 0 6px; }
  .ending-code { color: var(--muted); font-size: 13px; letter-spacing: .18em; }
  .ending-code b { color: #6fe3c9; font-weight: 600; }
  .archive { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 20px 0 4px; }
  .ar { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(255,255,255,.04); }
  .ar b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .ar span { font-size: 11.5px; color: var(--muted); }
  .paths { margin-top: 18px; font-size: 13px; color: var(--muted); line-height: 1.95; }
  .paths b { color: #d8d8e6; font-weight: 600; }
  .paths .lk { color: var(--accent); }
  .forks { margin-top: 16px; padding: 16px 18px; border-radius: 14px; border: 1px dashed rgba(255,209,102,.4); background: rgba(255,209,102,.06); font-size: 13.5px; color: #e2e2ee; }
  .forks b { color: var(--accent); }
  .forks div { margin-top: 6px; }
  footer { text-align: center; color: #63637c; font-size: 12px; margin-top: 32px; }

  /* 悬浮 Prompt 标签 */
  .prompt-badge {
    position: fixed; bottom: 18px; left: 18px; z-index: 10;
    max-width: 420px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px; color: rgba(255, 255, 255, 0.7);
    background: rgba(15, 18, 28, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px); border-radius: 8px; padding: 8px 12px;
    line-height: 1.45; pointer-events: none;
  }
  .prompt-badge b { color: var(--accent); font-weight: 600; display: block; margin-bottom: 2px; }

  /* 结局页 AI 寄语卡片 */
  .ai-card {
    margin-top: 20px; padding: 20px; border-radius: 14px;
    background: rgba(111, 227, 201, 0.06); border: 1px solid rgba(111, 227, 201, 0.3);
    text-align: left;
  }
  .ai-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    font-size: 13px; color: #6fe3c9; font-weight: 600; letter-spacing: .08em;
  }
  .ai-header::before {
    content: ""; display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: #6fe3c9; box-shadow: 0 0 10px #6fe3c9;
  }
  .ai-stream-text {
    font-size: 14.5px; line-height: 1.85; color: #e8f3ee; min-height: 54px;
    white-space: pre-line;
  }
  .typing-cursor::after {
    content: "▋"; display: inline-block; vertical-align: baseline;
    color: #6fe3c9; animation: blink 1s step-start infinite;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.1%, 100% { opacity: 0; } }

  @media (max-width: 720px) { .card { padding: 22px 18px; } h1 { font-size: 22px; } .ending-title { font-size: 25px; } }
</style>
</head>
<body>
<div class="prompt-badge" id="promptBadge" style="display: none;"></div>
<div class="bg" id="bg"></div>
<div id="app">
  <header>
    <div class="logo">大学模拟器 · <span>三条路</span></div>
    <div class="toolbar">
      <button class="tbtn" id="btnBack" onclick="goBack()">返回上一步</button>
      <button class="tbtn" onclick="restart()">重新开始</button>
    </div>
  </header>
  <div id="steps"></div>
  <main id="stage"></main>
  <footer>隐藏数值：学习能力 · 人际关系 · 实践经验 · 精力 —— 结局时揭晓 ｜ 插画为程序绘制的矢量场景</footer>
</div>

    '毕业时你的简历普普通通。你有点不甘心，又说不清自己在不甘心什么。',
    '回家的火车上你想通了一件事：下一次，至少要把一件事做完。'],
    wish: '没有全力以赴的人生，输的不是结果，是那句「如果当时」。' }
};

/* ============ 状态与逻辑 ============ */
var state = null;
function clamp(v) { return Math.max(0, Math.min(100, v)); }
function newGame() { state = { picks: [], step: 0, lastEffects: null }; }

function leanOf(i) { return chapterChoices(state.picks, i)[state.picks[i]].lean; }
function chapterChoices(picks, i) {
  if (i === 0) return SCENES.ch1.choices;
  if (i === 4) return SCENES.ch5.choices;
  if (i === 1) return SCENES.ch2[SCENES.ch1.choices[picks[0]].lean].choices;
  if (i === 2) {
    var l1 = SCENES.ch1.choices[picks[0]].lean;
    var l2 = SCENES.ch2[SCENES.ch1.choices[picks[0]].lean].choices[picks[1]].lean;
    if (l1 === l2) return SCENES.ch3[l1].choices;
    var key = [l1, l2].sort().join('_');
    var map = { club_create: 'cross_ct', club_study: 'cross_sc', create_study: 'cross_st' };
    return SCENES.ch3[map[key]].choices;
  }
  if (i === 3) {
    var ls = [];
    for (var k = 0; k < 3; k++) ls.push(chapterChoices(picks, k)[picks[k]].lean);
    var c = { study: 0, club: 0, create: 0 };
    ls.forEach(function (x) { c[x]++; });
    if (c.study && c.club && c.create) return SCENES.ch4.balance.choices;
    for (var kk in c) if (c[kk] >= 2) return SCENES.ch4[kk].choices;
    return SCENES.ch4.balance.choices;
  }
  return [];
}

function replay(picks) {
  var attrs = Object.assign({}, INIT), flags = [], scenes = [];
  for (var i = 0; i < 5; i++) {
    var choices = chapterChoices(picks, i);
    var c = choices[picks[i]];
    for (var k in c.effects) attrs[k] = clamp(attrs[k] + c.effects[k]);
    (c.flags || []).forEach(function (f) { if (flags.indexOf(f) < 0) flags.push(f); });
    scenes.push(c);
  }
  var st = { attrs: attrs, flags: flags };
  return { attrs: attrs, flags: flags, choices: scenes, ending: computeEnding(st) };
}

function computeEnding(st) {
  var a = st.attrs, f = st.flags;
  var c = { study: 0, club: 0, create: 0 };
  (st.leans || []).forEach(function (x) { if (x) c[x]++; });
  if (a.energy <= 25) return 'burnout';
  if (f.indexOf('bridge_st') >= 0 && c.study >= 2 && c.create >= 2) return 'thesis_art';
  if (f.indexOf('bridge_ct') >= 0 && c.club >= 2 && c.create >= 2) return 'viral';
  if (c.study >= 3) return 'scholar';
  if (c.create >= 3) return 'creator';
  if (c.club >= 3) return 'organizer';
  var maxc = Math.max(c.study, c.club, c.create);
  if (maxc <= 2 && a.energy <= 45) return 'ordinary';
  var top = ['study', 'club', 'create'].sort(function (x, y) {
    var d = c[y] - c[x];
    if (d) return d;
    return (y === 'study' ? a.study : y === 'club' ? a.social : a.practice) - (x === 'study' ? a.study : x === 'club' ? a.social : a.practice);
  });
  var pair = [top[0], top[1]].sort().join('_');
  if (pair === 'create_study') return 'explorer';
  if (pair === 'club_create') return 'media';
  return 'reliable';
}

function replayWithLeans(picks) {
  var r = replay(picks);
  r.leans = picks.map(function (p, i) { return chapterChoices(picks, i)[p].lean; });
  r.ending = computeEnding(r);
  return r;
}

function findForks(picks, base) {
  var res = [];
  for (var i = 0; i < 5; i++) {
    var choices = chapterChoices(picks, i);
    for (var j = 0; j < choices.length; j++) {
      if (j === picks[i]) continue;
      var alt = picks.slice(); alt[i] = j;
      var e = replayWithLeans(alt).ending;
      if (e !== base) { res.push({ i: i, j: j, ending: e }); break; }
    }
  }
  return res;
}

/* ============ 渲染与 AIGC 扩展逻辑 ============ */
var stage = document.getElementById('stage');
var stepsBox = document.getElementById('steps');
var bgBox = document.getElementById('bg');

function current() { return replayWithLeans(state.picks); }

function setBg(key) {
  var src = CHAPTER_IMG[key];
  if (bgBox.dataset.cur === src) return;
  bgBox.dataset.cur = src;
  bgBox.innerHTML = '<img src="' + src + '" alt="">';
  var img = bgBox.firstChild;
  img.onload = function() { img.classList.add('on'); };
  if (img.complete) img.classList.add('on');

  // 更新左下角的 Prompt 标签
  var badge = document.getElementById('promptBadge');
  if (PROMPTS_META[key]) {
    badge.style.display = 'block';
    badge.innerHTML = '<b>AIGC SCENE PROMPT:</b>' + PROMPTS_META[key];
  } else {
    badge.style.display = 'none';
  }
}

/* 模拟 AI 观察者评估生成 */
function generateAIEvaluation(r) {
  var a = r.attrs;
  var intro = "【AI 观察者系统正在解析你的大学四年运行日志...】\n";
  var coreTrait = "";
  
  if (a.energy <= 25) {
    coreTrait = "在数据底层，检测到你在精力阈值边缘频繁预警，你总试图把每一条支线都推向尽头。";
  } else if (a.study >= 65 && a.practice >= 50) {
    coreTrait = "你展现了极为罕见的『知行耦合度』，不仅在纯学术深度上扎下了根，还具备将推导转化为具象实物的行动力。";
  } else if (a.social >= 65) {
    coreTrait = "数据网络显示你构建了一个强连接的人际中枢，在群体面临变故的时刻，你总是不自觉地扮演了压舱石角色。";
  } else {
    coreTrait = "你在多个向量之间维持了温和的平衡，未曾盲信单一维度的评价指标。";
  }

  var advice = "";
  switch (r.ending) {
    case 'thesis_art':
      advice = "你跨越了专业与表达的界限。未来的网络媒体环境最需要的正是这种不受单一学科禁锢的复合型节点。保持你的不妥协。";
      break;
    case 'scholar':
      advice = "坐冷板凳是一种算法很难模拟的耐力。愿你在更高层级的学术洪流里，始终保留最初对未知的那份纯粹饥饿感。";
      break;
    case 'creator':
      advice = "你的作品列表已经沉淀为唯一的专属资产。请记住：工具与流量都会迭代，但你的独特观察力不可被算力替代。";
      break;
    default:
      advice = "大学不是一个单向执行的函数，没有绝对最优解。走过的路，每一步都会以隐性特征的形式编织进你的下一阶段。";
  }

  return intro + coreTrait + "\n\n" + advice;
}

/* 打字机平滑流式输出 */
function startTyping(text, elementId, speed) {
  var el = document.getElementById(elementId);
  if (!el) return;
  el.classList.add('typing-cursor');
  el.textContent = "";
  var idx = 0;
  var timer = setInterval(function() {
    el.textContent += text.charAt(idx);
    idx++;
    if (idx >= text.length) {
      clearInterval(timer);
      el.classList.remove('typing-cursor');
    }
  }, speed || 24);
}

function renderSteps() {
  var html = '<div class="steps">';
  for (var i = 0; i < 5; i++) html += '<div class="dot ' + (i < state.step ? 'done' : (i === state.step ? 'now' : '')) + '"></div>';
  html += '<div class="steps-label">' + CHNAMES[Math.min(state.step, 4)] + '</div></div>';
  stepsBox.innerHTML = html;
  document.getElementById('btnBack').disabled = state.picks.length === 0;
}

function sceneMeta(i) {
  var choices = chapterChoices(state.picks, i);
  var imgKey = { 0: 'ch1', 1: 'ch2', 2: 'ch3', 3: 'ch4', 4: 'ch5' }[i];
  var sc;
  if (i === 0) sc = SCENES.ch1;
  else if (i === 1) sc = SCENES.ch2[SCENES.ch1.choices[state.picks[0]].lean];
  else if (i === 2) {
    var l1 = SCENES.ch1.choices[state.picks[0]].lean;
    var l2 = SCENES.ch2[l1].choices[state.picks[1]].lean;
    sc = l1 === l2 ? SCENES.ch3[l1] : SCENES.ch3[{ club_create: 'cross_ct', club_study: 'cross_sc', create_study: 'cross_st' }[[l1, l2].sort().join('_')]];
  } else if (i === 3) {
    var c = { study: 0, club: 0, create: 0 };
    [0, 1, 2].forEach(function (k) { c[chapterChoices(state.picks, k)[state.picks[k]].lean]++; });
    sc = (c.study && c.club && c.create) ? SCENES.ch4.balance : SCENES.ch4[(c.study >= 2 && 'study') || (c.club >= 2 && 'club') || (c.create >= 2 && 'create') || 'balance'];
  } else sc = SCENES.ch5;
  return { scene: sc, choices: choices, imgKey: imgKey, variant: sc.title };
}

function feedback(effects) {
  var m = [];
  if (effects.study >= 12) m.push('你对专业的理解，明显深了一层');
  else if (effects.study > 0) m.push('你感觉专业课没那么陌生了');
  if (effects.study < 0) m.push('你落下了不少课，心里有点虚');
  if (effects.social >= 12) m.push('你身边能说话的人，肉眼可见地变多了');
  else if (effects.social > 0) m.push('你多认识了几个靠得住的人');
  if (effects.social < 0) m.push('热闹是他们的，你有点被落下了');
  if (effects.practice >= 12) m.push('你的手，比脑子先动起来了');
  else if (effects.practice > 0) m.push('想法开始变成做得出来的东西');
  if (effects.energy <= -10) m.push('你最近总是很累，照镜子时吓了自己一跳');
  else if (effects.energy < 0) m.push('你有点累了，但还扛得住');
  if (effects.energy >= 5) m.push('难得地，你睡了个好觉');
  return m;
}

function renderIntro() {
  setBg('ch1');
  stage.innerHTML = '<div class="card">'
    + '<div class="chapter">SIMULATOR · 三条路</div>'
    + '<h1>大学模拟器 · 三条路</h1>'
    + '<div class="intro-sub">专业学习、社团活动、兴趣创作——每一次选择都会真实改变你之后遇到的场景。没有固定的剧本，只有你走出来的那条。</div>'
    + '<div class="story">'
    + '<p>四项隐藏数值（学习能力、人际关系、实践经验、精力）在你每次选择后悄悄变动，结局时揭晓。</p>'
    + '<p><b>剧情会分支</b>：你在第二章遇到什么，取决于第一章选了什么；第三章可能触发「交叉事件」，第四章的危机由你的轨迹决定。某些结局，只有特定的路线组合才能解锁。</p>'
    + '<p>随时可以<b>返回上一步</b>重新选择，结局会告诉你：哪一步真正改写了你的人生。</p></div>'
    + '<div class="quote">每个人都只有四年，但四年可以被切成无数种形状。</div>'
    + '<button class="btn" onclick="startGame()">开始你的大学</button></div>';
}

function startGame() { newGame(); renderScene(); }
function restart() { renderIntro(); }

function goBack() {
  if (!state) return;
  if (state.picks.length === 0) { renderIntro(); return; }
  state.picks.pop();
  state.step = state.picks.length;
  renderScene();
}

function renderScene() {
  var i = state.step;
  var m = sceneMeta(i);
  var s = m.scene;
  setBg(s.img);
  renderSteps();
  var html = '<div class="card"><div class="chapter">' + s.time + '</div>'
    + '<h1>' + s.title + '</h1>'
    + '<div class="intro-sub">' + s.lead + '</div><div class="story">';
  s.story.forEach(function (p) { html += '<p>' + p + '</p>'; });
  html += '</div><div class="quote">' + s.quote + '</div><div class="choices">';
  m.choices.forEach(function (c, k) {
    html += '<button class="choice" onclick="pick(' + k + ')">'
      + '<span class="tag">选择 ' + 'ABC'[k] + '</span>'
      + '<span class="title">' + c.title + '</span>'
      + '<span class="desc">' + c.desc + '</span>'
      + (c.lean ? '<span class="lean">倾向 · ' + LEAN_NAME[c.lean] + '</span>' : '')
      + '</button>';
  });
  html += '</div><div style="margin-top:14px"><button class="tbtn" onclick="goBack()">返回上一步</button></div></div>';
  stage.innerHTML = html;
}

function pick(k) {
  var m = sceneMeta(state.step);
  var c = m.choices[k];
  state.picks.push(k);
  state.step++;
  state.lastEffects = c.effects;
  renderSteps();
  var last = state.step === 5;
  var fb = feedback(c.effects).map(function (x) { return '<div>' + x + '</div>'; }).join('');
  stage.innerHTML = '<div class="card"><div class="chapter">' + m.scene.time + ' · 你的选择</div>'
    + '<h1>' + c.title + '</h1>'
    + '<div class="result-box">' + c.result + '</div>'
    + (fb ? '<div class="fb">' + fb + '</div>' : '')
    + '<button class="btn" onclick="' + (last ? 'showEnding()' : 'renderScene()') + '">'
    + (last ? '看看你的结局' : '继续') + '</button>'
    + '<button class="btn ghost" onclick="goBack()">返回上一步</button></div>';
}

function showEnding() {
  var r = current(), e = ENDINGS[r.ending], a = r.attrs;
  setBg('ch5');
  
  var aiText = generateAIEvaluation(r);

  var html = '<div class="card"><div class="chapter">毕业那天</div>'
    + '<div class="ending-code">' + e.code + ' ｜ <b>隐藏数值揭晓</b></div>'
    + '<h1 class="ending-title">' + e.title + '</h1>'
    + '<div class="intro-sub">' + e.sub + '</div><div class="story">';
  e.text.forEach(function (p) { html += '<p>' + p + '</p>'; });
  html += '</div><div class="quote">' + e.wish + '</div>';

  // 插入 AI 寄语打字机卡片
  html += '<div class="ai-card">'
    + '<div class="ai-header">NEURAL ADVISOR · AI 观察者评估</div>'
    + '<div class="ai-stream-text" id="aiStream"></div>'
    + '</div>';

  html += '<div class="archive">';
  ATTR_META.forEach(function (x) {
    html += '<div class="ar"><b style="color:' + x.color + '">' + a[x.key] + '</b><span>' + x.name + '</span></div>';
  });
  html += '</div><div class="paths"><b>你的路线</b><br>';
  state.picks.forEach(function (p, i) {
    var ch = chapterChoices(state.picks, i)[p];
    var ln = ch.lean ? ' <span class="lk">' + LEAN_NAME[ch.lean] + '</span>' : '';
    html += '第' + (i + 1) + '章 ' + 'ABC'[p] + ' ' + ch.title + ln + '<br>';
  });
  html += '</div>';

  var forks = findForks(state.picks, r.ending);
  if (forks.length) {
    html += '<div class="forks"><b>真正改写结局的，是这几步</b>';
    forks.forEach(function (fk) {
      var ch = chapterChoices(state.picks, fk.i)[fk.j];
      html += '<div>· 如果第' + (fk.i + 1) + '章选 ' + 'ABC'[fk.j] + '（' + ch.title + '），你会走向《' + ENDINGS[fk.ending].title + '》</div>';
    });
    html += '</div>';
  } else {
    html += '<div class="forks"><b>这一次，你走得非常坚定</b><div>· 换掉其中任何一步，你依然会走向《' + e.title + '》。有些人生，是被性格决定的。</div></div>';
  }

  html += '<div style="margin-top:20px;"><button class="btn" onclick="startGame()">再走一次（试试别的路）</button>'
    + '<button class="btn ghost" onclick="restart()">回到封面</button></div></div>';
  
  stage.innerHTML = html;
  renderSteps();

  // 稍微延迟 300 毫秒启动打字机，营造生成感
  setTimeout(function() {
    startTyping(aiText, "aiStream", 25);
  }, 300);
}

renderIntro();
</script>
